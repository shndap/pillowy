name: Pill reminder scheduler

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. This requests a run every minute and the API
    # handles each user's timezone and the missed-reminder window.
    - cron: "* * * * *"

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process due medication reminders
        env:
          SCHEDULER_URL: ${{ secrets.SCHEDULER_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SCHEDULER_URL"
          test -n "$SCHEDULER_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST "$SCHEDULER_URL" \
            --header "X-Scheduler-Secret: $SCHEDULER_SECRET" \
            --header "Accept: application/json"
